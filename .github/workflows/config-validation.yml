name: Config validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-config:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run lightweight validation tests
        run: python -m unittest discover -s tests -v
